<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neutrophil Patrol</title>
<style>
:root{--ink:#fff3ee;--mut:#e9b9b4;--card:rgba(28,6,12,.9);--ok:#4fd88a;--bad:#ff4d63;--gold:#ffd166;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#2a060d;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{position:fixed;inset:0}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;font-size:15px;pointer-events:none}
#hud button{pointer-events:auto}
#lives{font-size:28px;color:var(--bad);letter-spacing:3px;text-shadow:0 2px 8px #000}
#prog{color:var(--mut)}
button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:11px 14px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.ok{background:var(--ok);color:#06240f;border-color:var(--ok)}
button.bad{background:var(--bad);color:#2b0008;border-color:var(--bad)}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(94vw,640px);background:var(--card);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:14px;display:grid;gap:8px;max-height:60vh;overflow:auto}
#panel .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
#panel .row b{font-size:19px}
.kind{color:var(--gold);font-style:italic}
.hp{margin-left:auto;color:var(--bad);letter-spacing:3px}
.q{font-size:18px;line-height:1.35}
#panel button{text-align:left}
#modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(circle,rgba(20,0,6,.3),rgba(20,0,6,.8))}
.card{width:min(94vw,520px);max-height:88vh;overflow:auto;background:var(--card);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:22px;display:grid;gap:12px}
.card h1{margin:0;font-size:32px;line-height:1.1}
.card p,.card li{line-height:1.5;font-size:16px;margin:0}
.card ul{margin:0;padding-left:20px;display:grid;gap:8px}
.chip{color:var(--gold);font-style:italic}
.card button.go{background:var(--gold);color:#2b1700;border-color:var(--gold);font-weight:bold}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:14px;pointer-events:none;padding:0 12px;text-shadow:0 1px 6px #000}
*{-webkit-tap-highlight-color:transparent;user-select:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#npc{position:fixed;left:50%;transform:translateX(-50%);top:calc(48px + env(safe-area-inset-top,0px));width:min(92vw,520px);background:var(--card);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4;pointer-events:none}
#inf{position:fixed;left:14px;right:14px;top:calc(40px + env(safe-area-inset-top,0px));height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;pointer-events:none}
#inf i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd35a,#ff4d63)}
#ar{position:fixed;font-size:34px;color:var(--gold);pointer-events:none;text-shadow:0 2px 8px #000}
#jb,#jk{position:fixed;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
#jb{width:110px;height:110px;border:2px solid rgba(255,255,255,.35)}
#jk{width:44px;height:44px;background:rgba(255,255,255,.45)}
#vert{display:none;position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));gap:12px}
@media (pointer:coarse){#vert{display:grid}}
#vert button{width:56px;height:56px;border-radius:50%;padding:0;font-size:22px;touch-action:none}
#panel button{min-height:44px}
@media (max-height:520px){#panel{max-height:64vh}.q{font-size:15px}#panel button{padding:8px 12px;min-height:38px}#lives{font-size:22px}}
#bn{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;text-shadow:0 3px 14px #000;padding:0 12px}
#bn h2{margin:0;font-size:clamp(30px,8vw,58px)}
#bn p{margin:6px 0 0;color:var(--gold);font-style:italic;font-size:18px}
#pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-size:26px;font-weight:bold;pointer-events:none;opacity:0;text-shadow:0 2px 10px #000;white-space:nowrap}
#pop.on{animation:pp 1.1s ease-out}
@keyframes pp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-50px)}}
.tbw{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.tbw i{display:block;height:100%;width:100%;background:var(--gold)}
#panel button.ll{text-align:center;border-color:var(--gold);color:var(--gold);min-height:36px}
#flash{position:fixed;inset:0;background:radial-gradient(circle,transparent 30%,rgba(255,30,60,.7));opacity:0;pointer-events:none;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){#flash{transition:none}}

{n:'Helicobacter pylori',k:'Bacterium',q:[['Why does stomach acid help protect you?','It kills many pathogens in food and drink','It makes antibodies','It clots blood','It carries oxygen'],['What is a pathogen?','An organism that causes disease','A cell that makes antibodies','A part of blood','A type of antibiotic']],i:['A spiral bacterium that lives in the stomach lining.','It tolerates stomach acid and can cause ulcers. Antibiotics treat it.']},
{n:'Cryptococcus',k:'Fungus',q:[['How do fungi feed?','They secrete enzymes onto food and absorb the products','By photosynthesis','By engulfing food like a phagocyte','They never feed'],['Which is true of fungi?','They have no chlorophyll so cannot photosynthesise','They have cellulose walls','They have no nucleus','They are made of a protein coat']],i:['A yeast-like fungus found in soil and bird droppings.','Like all fungi it has chitin cell walls and feeds by secreting enzymes. Spores can be inhaled by people with weak immunity.']},
{n:'Ringworm (Trichophyton)',k:'Fungus',q:[['Ringworm is caused by a…','Fungus','Worm','Virus','Bacterium'],['How does ringworm spread?','Direct contact with skin or shared towels','Mosquito bites only','Sunlight','Tap water']],i:['A skin fungus. There is no worm, just a ring-shaped rash.','It spreads by touch and shared items, so hygiene helps. Antifungal cream treats it.']},
{n:'Plasmodium (malaria)',k:'Protoctist',q:[['Which organism spreads malaria?','Female Anopheles mosquito','Housefly','Tick','Flea'],['What is the best way to reduce malaria?','Control mosquitoes and use bed nets','Give everyone antibiotics','Wash hands more','Avoid sunlight'],['What type of organism is Plasmodium?','A protoctist','A virus','A fungus','A bacterium']],i:['A single-celled protoctist that lives in red blood cells and liver cells.','It is passed on when an infected mosquito bites. The mosquito is the vector.','Control mosquito breeding, use nets and take anti-malarial drugs.']},
{n:'Vibrio cholerae',k:'Bacterium',q:[['Cholera is mainly spread by…','Contaminated water','Mosquito bites','Droplets in the air','Sunlight'],['What prevents cholera outbreaks?','Clean water and sewage treatment','Mosquito nets','Antivirals','Cooler weather'],['What does the cholera toxin cause?','Severe diarrhoea and dehydration','Broken bones','A skin rash','Hay fever']],i:['A comma-shaped bacterium with one flagellum.','Its toxin makes the gut lose water, causing severe diarrhoea and dehydration.','Treat with oral rehydration. Prevent with clean water and sewage treatment.']},
{n:'Superbug (resistant bacterium)',k:'Bacterium',q:[['Why do resistant strains become common?','Antibiotics kill the non-resistant bacteria, so resistant ones reproduce','Antibiotics make bacteria stronger','Bacteria learn from patients','Resistant bacteria are bigger'],['What helps slow antibiotic resistance?','Use antibiotics only when needed and finish the course','Taking antibiotics for colds','Sharing leftover antibiotics','Stopping when you feel better'],['The spread of resistance is an example of…','Natural selection','Photosynthesis','Osmosis','Vaccination']],i:['A bacterium that has evolved resistance to many antibiotics.','Resistant mutants survive treatment, reproduce and pass on the gene.']},
{n:'Measles virus',k:'Virus',q:[['Why can a vaccine give long-term protection?','It causes memory cells to be made','It contains antibiotics','It contains red blood cells','It kills the virus in the body'],['Measles spreads by…','Droplets from coughs and sneezes','Mosquito bites','Contaminated water','Soil']],i:['A virus that causes fever and a red rash.','The MMR vaccine gives memory cells, so you respond fast if the real virus arrives.']},

{n:'Mycobacterium tuberculosis',k:'Bacterium',q:[['Tuberculosis mainly infects the…','Lungs','Stomach','Skin','Eyes'],['How does TB spread?','Droplets from an infected person’s coughs','Mosquito bites','Soil','Sunlight']],i:['A slow-growing bacterium that causes TB.','It spreads in droplets and needs a long course of antibiotics. Finishing the course matters to avoid resistance.']},
{n:'Lactobacillus',k:'Bacterium',q:[['Which bacteria are used to make yoghurt from milk?','Lactobacillus','Plasmodium','Vibrio','HIV'],['In yoghurt making, bacteria turn lactose into…','Lactic acid','Alcohol','Glucose','Starch']],i:['A friendly rod-shaped bacterium.','Not every microbe is a pathogen. Lactobacillus is used in biotechnology to make yoghurt and cheese.']},

{const p=tg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),k=1+.08*Math.sin(z*.13+Math.atan2(y,x)*3);p.setXY(i,x*k,y*k)}}
